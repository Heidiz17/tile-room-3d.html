<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D/3D 輕裝修鋪磚空間卡帶</title>
  <!-- 引入輕量 Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #1a1a1a; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    #header { padding: 12px; background: #262626; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    input, button, select { padding: 8px 12px; border-radius: 6px; border: 1px solid #444; background: #333; color: #fff; }
    button { background: #0070f3; cursor: pointer; border: none; font-weight: bold; }
    button:active { opacity: 0.8; }
    #workspace { display: flex; flex: 1; height: calc(100vh - 120px); }
    #pane-2d { flex: 1; border-right: 2px solid #333; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #222; position: relative; }
    #pane-3d { flex: 1; position: relative; }
    #info-bar { padding: 10px 15px; background: #111; font-size: 14px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #333; }
    canvas#cv-2d { background: #2d2d2d; border: 2px solid #555; }
  </style>
</head>
<body>

  <!-- 控制面板 -->
  <div id="header">
    <label>闊(W mm): <input type="number" id="rm-w" value="3000" style="width:75px;"></label>
    <label>長(L mm): <input type="number" id="rm-l" value="4000" style="width:75px;"></label>
    <label>高(H mm): <input type="number" id="rm-h" value="2600" style="width:75px;"></label>
    <label>地磚: 
      <select id="tile-sz">
        <option value="600">600 x 600 mm (標準大磚)</option>
        <option value="300">300 x 300 mm (細磚/浴室)</option>
        <option value="800">800 x 800 mm (豪宅大板)</option>
      </select>
    </label>
    <button onclick="updateAll()">🔄 重新計算並生成 3D</button>
  </div>

  <!-- 主操作區：左 2D 俯瞰，右 3D 空間 -->
  <div id="workspace">
    <div id="pane-2d">
      <div style="position: absolute; top: 10px; left: 10px; color: #888; font-size: 12px;">📐 2D 俯瞰網格排磚</div>
      <canvas id="cv-2d" width="350" height="350"></canvas>
    </div>
    <div id="pane-3d">
      <div style="position: absolute; top: 10px; left: 10px; color: #888; font-size: 12px; z-index: 10;">🧊 3D 空間視角（手指拖曳旋轉 / 滾輪縮放）</div>
    </div>
  </div>

  <!-- 下方實質用量核算 -->
  <div id="info-bar">
    <div id="stat-text">面積：12 平方米 (約 129 呎) | 估算磚數：34 塊 (加 10% 耗損約 38 塊)</div>
    <button style="background: #25D366;" onclick="exportWhatsApp()">📲 匯出報價單</button>
  </div>

  <script>
    // 1. 初始化 3D 環境
    const container3D = document.getElementById('pane-3d');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x181818);

    const camera = new THREE.PerspectiveCamera(45, container3D.clientWidth / container3D.clientHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container3D.clientWidth, container3D.clientHeight);
    container3D.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // 燈光
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    let roomGroup = new THREE.Group();
    scene.add(roomGroup);

    // 2. 核心計算與同步渲染
    function updateAll() {
      const W = parseFloat(document.getElementById('rm-w').value) || 3000;
      const L = parseFloat(document.getElementById('rm-l').value) || 4000;
      const H = parseFloat(document.getElementById('rm-h').value) || 2600;
      const T = parseFloat(document.getElementById('tile-sz').value) || 600;

      // 算面積與磚數
      const areaM2 = (W * L) / 1000000;
      const areaFt2 = areaM2 * 10.764;
      const tilesX = Math.ceil(W / T);
      const tilesZ = Math.ceil(L / T);
      const totalRawTiles = tilesX * tilesZ;
      const totalOrderTiles = Math.ceil(totalRawTiles * 1.1); // 加 10% 耗損

      // 更新文字
      document.getElementById('stat-text').innerHTML = 
        `面積：<b>${areaM2.toFixed(1)}</b> ㎡ (約 <b>${areaFt2.toFixed(0)}</b> 呎) | 排磚：<b>${tilesX} × ${tilesZ}</b> | 預算：<b>${totalRawTiles}</b> 塊 (連10%損耗建議 <b>${totalOrderTiles}</b> 塊)`;

      // 畫 2D
      draw2D(W, L, T, tilesX, tilesZ);

      // 畫 3D
      draw3D(W, L, H, T, tilesX, tilesZ);
    }

    // 3. 繪製 2D 俯瞰
    function draw2D(W, L, T, tx, tz) {
      const cv = document.getElementById('cv-2d');
      const ctx = cv.getContext('2d');
      ctx.clearRect(0, 0, cv.width, cv.height);

      const maxDim = Math.max(W, L);
      const scale = 280 / maxDim;
      const drawW = W * scale;
      const drawL = L * scale;
      const ox = (cv.width - drawW) / 2;
      const oy = (cv.height - drawL) / 2;

      // 畫地台
      ctx.fillStyle = '#444';
      ctx.fillRect(ox, oy, drawW, drawL);

      // 畫地磚格仔
      ctx.strokeStyle = '#666';
      ctx.lineWidth = 1;
      const step = T * scale;
      for (let x = ox; x <= ox + drawW; x += step) {
        ctx.beginPath(); ctx.moveTo(x, oy); ctx.lineTo(x, oy + drawL); ctx.stroke();
      }
      for (let y = oy; y <= oy + drawL; y += step) {
        ctx.beginPath(); ctx.moveTo(ox, y); ctx.lineTo(ox + drawW, y); ctx.stroke();
      }

      // 外外框與尺寸標記
      ctx.strokeStyle = '#0070f3';
      ctx.lineWidth = 2;
      ctx.strokeRect(ox, oy, drawW, drawL);
      ctx.fillStyle = '#aaa';
      ctx.font = '12px sans-serif';
      ctx.fillText(`${W} mm`, ox + drawW/2 - 25, oy - 8);
      ctx.fillText(`${L} mm`, ox + drawW + 6, oy + drawL/2);
    }

    // 4. 繪製 3D 空間 (Three.js)
    function draw3D(W, L, H, T, tx, tz) {
      // 清空舊模型
      while(roomGroup.children.length > 0){ 
        roomGroup.remove(roomGroup.children[0]); 
      }

      const sW = W / 1000;
      const sL = L / 1000;
      const sH = H / 1000;

      // 生成動態格仔貼圖 (純代碼生成，零外部圖片)
      const canvasTex = document.createElement('canvas');
      canvasTex.width = 128; canvasTex.height = 128;
      const tctx = canvasTex.getContext('2d');
      tctx.fillStyle = '#dcdde1'; tctx.fillRect(0, 0, 128, 128);
      tctx.strokeStyle = '#718093'; tctx.lineWidth = 4;
      tctx.strokeRect(0, 0, 128, 128);
      const floorTex = new THREE.CanvasTexture(canvasTex);
      floorTex.wrapS = THREE.RepeatWrapping;
      floorTex.wrapT = THREE.RepeatWrapping;
      floorTex.repeat.set(tx, tz);

      // 地板
      const floorGeo = new THREE.PlaneGeometry(sW, sL);
      const floorMat = new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.4 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      roomGroup.add(floor);

      // 牆壁 (留出前、右兩面牆，形成通透展示角)
      const wallMat = new THREE.MeshStandardMaterial({ color: 0xefede6, roughness: 0.8 });
      // 背牆
      const backWall = new THREE.Mesh(new THREE.BoxGeometry(sW, sH, 0.05), wallMat);
      backWall.position.set(0, sH / 2, -sL / 2);
      roomGroup.add(backWall);
      // 左牆
      const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.05, sH, sL), wallMat);
      leftWall.position.set(-sW / 2, sH / 2, 0);
      roomGroup.add(leftWall);

      // 擺一張示意床（長方體傢俬）
      const bedMat = new THREE.MeshStandardMaterial({ color: 0x8c7ae6 });
      const bed = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.45, 1.9), bedMat);
      bed.position.set(-sW/2 + 0.85, 0.45/2, -sL/2 + 1.05);
      roomGroup.add(bed);

      // 調整相機位置對準房間
      camera.position.set(sW * 1.5, sH * 1.5, sL * 1.5);
      controls.target.set(0, sH / 3, 0);
      controls.update();
    }

    // 5. 匯出 WhatsApp 文字
    function exportWhatsApp() {
      const W = document.getElementById('rm-w').value;
      const L = document.getElementById('rm-l').value;
      const T = document.getElementById('tile-sz').value;
      const stat = document.getElementById('stat-text').innerText;
      const msg = `【裝修鋪磚尺寸詢價】\n規格：長 ${L}mm x 闊 ${W}mm\n選磚：${T}x${T}mm\n${stat}\n請問包工包料報價如何？`;
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`);
    }

    // 動畫迴圈
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    window.onload = () => {
      updateAll();
      animate();
    };

    window.onresize = () => {
      camera.aspect = container3D.clientWidth / container3D.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container3D.clientWidth, container3D.clientHeight);
    };
  </script>
</body>
</html>
