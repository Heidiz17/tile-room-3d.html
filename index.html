<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>圖層王 - 人類手帳TXT空間卡帶</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #1a1a1a; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    #header { padding: 6px 10px; background: #262626; display: flex; gap: 5px; align-items: center; flex-wrap: wrap; z-index: 10; border-bottom: 1px solid #333; }
    .input-group { display: flex; align-items: center; gap: 3px; font-size: 11px; }
    input { padding: 3px 5px; border-radius: 4px; border: 1px solid #444; background: #333; color: #fff; font-size: 11px; width: 48px; }
    button { padding: 4px 8px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; font-size: 11px; }
    .btn-action { background: #0070f3; color: #fff; }
    .btn-calc { background: #9b59b6; color: #fff; }
    .btn-txt { background: #e67e22; color: #fff; }
    
    /* TXT 手帳抽屜面板 */
    #txt-drawer { display: none; padding: 8px 10px; background: #222; border-bottom: 2px solid #0070f3; flex-direction: column; gap: 5px; }
    #txt-area { width: 100%; height: 95px; background: #111; color: #00ffcc; border: 1px solid #444; border-radius: 4px; padding: 6px; font-family: monospace; font-size: 11px; line-height: 1.4; resize: none; }
    
    /* 條目橫向滑動列（左至右碌） */
    #cat-bar { padding: 4px 10px; background: #1c1c1c; display: flex; gap: 6px; border-bottom: 1px solid #333; align-items: center; }
    .btn-cat { background: #333; color: #aaa; padding: 3px 8px; border-radius: 12px; font-size: 10px; }
    .btn-cat.active { background: #2980b9; color: #fff; font-weight: bold; }
    #item-deck { padding: 4px 10px; background: #181818; display: flex; gap: 6px; overflow-x: auto; border-bottom: 1px solid #333; white-space: nowrap; }
    .chip { background: #2f3640; border: 1px solid #555; padding: 3px 8px; border-radius: 12px; font-size: 10px; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
    .chip.active { border-color: #00d2d3; background: #34495e; font-weight: bold; }
    .chip span.del { color: #ff6b6b; cursor: pointer; font-weight: bold; }

    #face-tabs { padding: 4px 10px; background: #202020; display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid #333; white-space: nowrap; }
    .tab-btn { background: #333; color: #aaa; padding: 3px 8px; border-radius: 10px; font-size: 10px; cursor: pointer; border: 1px solid #444; }
    .tab-btn.active { background: #0070f3; color: #fff; border-color: #00a8ff; font-weight: bold; }

    #workspace { display: flex; flex: 1; min-height: 0; width: 100%; position: relative; flex-direction: column; }
    @media (min-width: 769px) { #workspace { flex-direction: row; } }
    #pane-2d { flex: 1; border-bottom: 1px solid #333; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #222; position: relative; overflow: hidden; touch-action: none; }
    #pane-3d { flex: 1; position: relative; overflow: hidden; width: 100%; height: 100%; }
    
    .pane-tag { position: absolute; top: 6px; left: 6px; color: #aaa; font-size: 10px; z-index: 5; background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 4px; pointer-events: none; }
    #cam-ctrl { position: absolute; top: 6px; right: 6px; z-index: 10; display: flex; gap: 4px; }
    #cam-ctrl button { background: rgba(0,0,0,0.65); color: #fff; border: 1px solid #666; font-size: 10px; padding: 3px 6px; }
    canvas#cv-2d { background: #2d2d2d; border: 1px solid #444; border-radius: 4px; }
    
    #float-ctrl { position: absolute; bottom: 8px; right: 8px; display: none; gap: 6px; z-index: 20; }
    #float-ctrl button { background: #e67e22; color: #fff; padding: 6px 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.5); }

    #info-bar { padding: 6px 10px; background: #111; font-size: 11px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #333; gap: 8px; }
    #stat-text { flex: 1; line-height: 1.3; color: #ddd; }
    #stat-text b { color: #fff; }
    #btn-wa { background: #25D366; color: #fff; white-space: nowrap; }

    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 99; justify-content: center; align-items: center; }
    .modal-content { background: #2c3e50; padding: 14px; border-radius: 8px; width: 88%; max-width: 330px; font-size: 12px; display: flex; flex-direction: column; gap: 7px; }
    .detail-row { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; border-bottom: 1px solid #3d566e; }
  </style>
</head>
<body>

  <!-- 控制面板 -->
  <div id="header">
    <div class="input-group"><label>闊:</label><input type="number" id="rm-w" value="2150" readonly></div>
    <div class="input-group"><label>長:</label><input type="number" id="rm-l" value="2650" readonly></div>
    <div class="input-group"><label>高:</label><input type="number" id="rm-h" value="2600" readonly></div>
    <button class="btn-txt" onclick="toggleTxtDrawer()">📝 人類手帳 TXT</button>
    <button class="btn-calc" onclick="openModal('modal-material')">📊 點料</button>
    <button style="background:#c0392b;" onclick="newBlankRoom()">📄 開新吉房</button>
    <button class="btn-action" onclick="reset2DView()">🔍 居中</button>
  </div>

  <!-- 人類手帳 TXT 展開抽屜 -->
  <div id="txt-drawer">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span style="font-size:11px; color:#aaa;">📝 人類自然語言手帳 (直接改字 ➔ 撳套用)</span>
      <div style="display:flex; gap:6px;">
        <button style="background:#27ae60; padding:3px 8px;" onclick="applyTxtBlueprint()">⚡ 套用手帳</button>
        <button style="background:#7f8c8d; padding:3px 8px;" onclick="toggleTxtDrawer()">收起</button>
      </div>
    </div>
    <textarea id="txt-area" spellcheck="false"></textarea>
  </div>

  <!-- 兩大分類主選籤 -->
  <div id="cat-bar">
    <button id="cat-btn-struct" class="btn-cat" onclick="switchCategory('struct')">🏛️ 建築結構</button>
    <button id="cat-btn-item" class="btn-cat active" onclick="switchCategory('item')">🛋️ 傢俬與設備</button>
    <span style="margin-left:auto; font-size:10px; color:#888;">點擊條目直達該面</span>
  </div>

  <!-- 橫向滑動條目列 -->
  <div id="item-deck">
    <div id="chips-container" style="display:inline-flex; gap:6px;"></div>
  </div>

  <!-- 六面視點切換列 -->
  <div id="face-tabs">
    <div class="tab-btn active" onclick="switchFace('floor')">地板 (Floor)</div>
    <div class="tab-btn" onclick="switchFace('front')">前牆 (主景牆)</div>
    <div class="tab-btn" onclick="switchFace('back')">後牆 (門口牆)</div>
    <div class="tab-btn" onclick="switchFace('left')">左牆</div>
    <div class="tab-btn" onclick="switchFace('right')">右牆</div>
    <div class="tab-btn" onclick="switchFace('ceiling')">天花 (Ceiling)</div>
  </div>

  <!-- 主操作區 -->
  <div id="workspace">
    <div id="pane-2d">
      <div id="face-tag" class="pane-tag">📐 當前視點: 地板 (實體阻擋中)</div>
      <canvas id="cv-2d" width="320" height="320"></canvas>
      <div id="float-ctrl">
        <button onclick="rotateSelectedItem()">🔄 旋轉 90°</button>
      </div>
    </div>
    <div id="pane-3d">
      <div class="pane-tag">🧊 3D 空間視角</div>
      <div id="cam-ctrl">
        <button onclick="set3DCameraMode('corner')">望內角</button>
        <button onclick="set3DCameraMode('door')">回望門口</button>
        <button onclick="set3DCameraMode('ceiling')">仰視天花</button>
      </div>
    </div>
  </div>

  <!-- 底部核算 -->
  <div id="info-bar">
    <div id="stat-text">計算中...</div>
    <button id="btn-wa" onclick="exportWhatsApp()">📲 出單</button>
  </div>




    <!-- Modal: 點料算料 (呎數 + 單價) -->
  <div id="modal-material" class="modal">
    <div class="modal-content">
      <b>📊 裝修工程用料詳細清算 (以實用呎數為準)</b>
      <div class="detail-row"><span>房間淨鋪設面積:</span><b id="mat-floor-sqft">-- 呎</b></div>
      <div class="detail-row"><span>扣除石屎柱佔用:</span><b id="mat-pillar-sub">-- 呎</b></div>
      <div class="detail-row" style="color:#2ecc71;"><span>建議備料總呎數 (+10%耗損):</span><b id="mat-floor-order">-- 呎</b></div>
      <div class="detail-row">
        <span>地板材料單價 (HK$/呎):</span>
        <input type="number" id="inp-floor-price" value="35" style="width:65px;" oninput="calcAllMaterials()">
      </div>
      <div class="detail-row" style="color:#00d2d3;"><span>估算地板材料費:</span><b id="mat-floor-cost">HK$ --</b></div>
      <hr style="border:none; border-top:1px solid #444; margin:4px 0;">
      <div class="detail-row"><span>四幅牆塗刷面積 (扣除房門):</span><b id="mat-paint-sqft">-- 呎</b></div>
      <div class="detail-row">
        <span>乳膠漆連工料 (HK$/呎):</span>
        <input type="number" id="inp-paint-price" value="22" style="width:65px;" oninput="calcAllMaterials()">
      </div>
      <div class="detail-row" style="color:#f1c40f;"><span>估算牆身油漆費:</span><b id="mat-paint-cost">HK$ --</b></div>
      <div class="detail-row"><span>空間體積:</span><b id="mat-vol">-- m³</b></div>
      <div style="display:flex; justify-content:flex-end; margin-top:5px;">
        <button class="btn-action" onclick="closeModal('modal-material')">確定完成</button>
      </div>
    </div>
  </div>

  <script>
    let curCategory = 'item';
    let curFace = 'floor';
    let selectedItemId = 101;
    let viewZoom = 1.0, viewPanX = 0, viewPanY = 0;

    let roomDoor = { face: "back", w: 750, h: 2000, x: 200, swingRadius: 750 };
    let structures = [];
    let items = [];

    // 預設香港眼鏡房人類手帳模板
    const defaultTxtBlueprint = 
`房型: 2150 x 2650 x 2600
門口: 闊 750, 距左邊 200, 裝喺 後牆

# 建築結構 (不可改動)
柱: 左上角柱, 350 x 350, 擺喺 0, 0
樑: 窗台大陣, 闊 2150, 深 300, 吊 350, 擺喺 0, 0

# IKEA / 淘寶傢俬設備
傢俬: IKEA Malm 雙人床, 1560 x 2090 x 380, 擺喺 400, 0, 地板
傢俬: 13A雙位電掣, 146 x 25 x 86, 擺喺 500, 300, 前牆
傢俬: 吸頂風扇燈, 500 x 500 x 250, 擺喺 800, 1000, 天花`;

    // 核心 TXT 自然語言翻譯機 (將人類寫的字解析為坐標)
    function parseTxtBlueprint(text) {
      const lines = text.split('\n');
      let newW = 2150, newL = 2650, newH = 2600;
      let newStructures = [], newItems = [];
      let newDoor = { ...roomDoor };

      lines.forEach((l, idx) => {
        const line = l.trim();
        if (!line || line.startsWith('#')) return;

        if (line.startsWith('房型:')) {
          const m = line.match(/(\d+)\s*x\s*(\d+)\s*x\s*(\d+)/i);
          if (m) { newW = parseFloat(m[1]); newL = parseFloat(m[2]); newH = parseFloat(m[3]); }
        } else if (line.startsWith('門口:')) {
          const wM = line.match(/闊\s*(\d+)/), xM = line.match(/距左邊\s*(\d+)/);
          if (wM) newDoor.w = parseFloat(wM[1]);
          if (xM) newDoor.x = parseFloat(xM[1]);
          newDoor.swingRadius = newDoor.w;
        } else if (line.startsWith('柱:')) {
          const parts = line.replace('柱:', '').split(',');
          if (parts.length >= 3) {
            const name = parts[0].trim();
            const sz = parts[1].match(/(\d+)\s*x\s*(\d+)/i);
            const pos = parts[2].match(/(\d+)\s*,\s*(\d+)/);
            if (sz && pos) {
              newStructures.push({
                id: Date.now() + idx, type: 'pillar', name: name,
                w: parseFloat(sz[1]), l: parseFloat(sz[2]), d: newH,
                x: parseFloat(pos[1]), y: parseFloat(pos[2])
              });
            }
          }
        } else if (line.startsWith('樑:')) {
          const parts = line.replace('樑:', '').split(',');
          const name = parts[0].trim();
          const wM = line.match(/闊\s*(\d+)/), dM = line.match(/深\s*(\d+)/), hM = line.match(/吊\s*(\d+)/);
          const pos = line.match(/擺喺\s*(\d+)\s*,\s*(\d+)/);
          newStructures.push({
            id: Date.now() + idx, type: 'beam', name: name,
            w: wM ? parseFloat(wM[1]) : newW, l: dM ? parseFloat(dM[1]) : 300, d: hM ? parseFloat(hM[1]) : 350,
            x: pos ? parseFloat(pos[1]) : 0, y: pos ? parseFloat(pos[2]) : 0
          });
        } else if (line.startsWith('傢俬:')) {
          const parts = line.replace('傢俬:', '').split(',');
          if (parts.length >= 4) {
            const name = parts[0].trim();
            const sz = parts[1].match(/(\d+)\s*x\s*(\d+)\s*x\s*(\d+)/i);
            const pos = parts[2].match(/(\d+)\s*,\s*(\d+)/);
            const faceStr = parts[3].trim();
            let face = 'floor';
            if (faceStr.includes('前')) face = 'front';
            else if (faceStr.includes('後')) face = 'back';
            else if (faceStr.includes('左')) face = 'left';
            else if (faceStr.includes('右')) face = 'right';
            else if (faceStr.includes('天花')) face = 'ceiling';

            if (sz && pos) {
              const isSocket = name.includes('電掣');
              newItems.push({
                id: Date.now() + idx, name: name, face: face,
                w: parseFloat(sz[1]), l: parseFloat(sz[2]), h: parseFloat(sz[3]),
                x: parseFloat(pos[1]), y: parseFloat(pos[2]), rot: 0,
                col: isSocket ? 0xe74c3c : (face === 'ceiling' ? 0x00d2d3 : 0x8c7ae6)
              });
            }
          }
        }
      });

      document.getElementById('rm-w').value = newW;
      document.getElementById('rm-l').value = newL;
      document.getElementById('rm-h').value = newH;
      roomDoor = newDoor;
      structures = newStructures;
      items = newItems;
      if (items.length) selectedItemId = items[0].id;
    }

    function toggleTxtDrawer() {
      const d = document.getElementById('txt-drawer');
      d.style.display = d.style.display === 'flex' ? 'none' : 'flex';
    }

    function applyTxtBlueprint() {
      const txt = document.getElementById('txt-area').value;
      parseTxtBlueprint(txt);
      updateAll();
      alert("✅ 已成功根據人類手帳更新全屋尺寸與物件！");
    }

    // 開新吉房：清空傢俬與結構，給用家純淨白紙
    function newBlankRoom() {
      const blankTxt = 
`房型: 2150 x 2650 x 2600
門口: 闊 750, 距左邊 200, 裝喺 後牆

# 建築結構 (請在下方按格式自由加柱/樑)

# IKEA / 淘寶傢俬設備 (請在下方自由加傢俬)`;
      document.getElementById('txt-area').value = blankTxt;
      parseTxtBlueprint(blankTxt);
      updateAll();
      toggleTxtDrawer();
    }

    // Three.js 引擎
    const container3D = document.getElementById('pane-3d');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x181818);
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container3D.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    scene.add(new THREE.AmbientLight(0xffffff, 0.85));
    const dLight = new THREE.DirectionalLight(0xffffff, 0.55);
    dLight.position.set(6, 12, 8);
    scene.add(dLight);
    let roomGroup = new THREE.Group();
    scene.add(roomGroup);

    function resizeRenderer() {
      const w = container3D.clientWidth, h = container3D.clientHeight;
      if (!w || !h) return;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }




        function switchCategory(cat) {
      curCategory = cat;
      document.getElementById('cat-btn-struct').classList.toggle('active', cat === 'struct');
      document.getElementById('cat-btn-item').classList.toggle('active', cat === 'item');
      renderChips();
    }

    function switchFace(face) {
      curFace = face;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      const names = { floor: "地板 (Floor)", front: "前牆 (主景牆)", back: "後牆 (門口牆)", left: "左牆", right: "右牆", ceiling: "天花 (Ceiling)" };
      document.getElementById('face-tag').innerText = `📐 當前視點: ${names[face]} (實體阻擋中)`;
      reset2DView();
      updateAll();
    }

    function set3DCameraMode(mode) {
      const W = parseFloat(document.getElementById('rm-w').value)/1000;
      const L = parseFloat(document.getElementById('rm-l').value)/1000;
      const H = parseFloat(document.getElementById('rm-h').value)/1000;
      if (mode === 'corner') {
        camera.position.set(W*1.2, H*1.3, L*1.4);
        controls.target.set(0, H/3, 0);
      } else if (mode === 'door') {
        camera.position.set(0, H*0.8, -L*1.1);
        controls.target.set(0, H/2, L/2);
      } else if (mode === 'ceiling') {
        camera.position.set(0, 0.4, 0);
        controls.target.set(0, H, 0);
      }
      controls.update();
    }

    function rotateSelectedItem() {
      const it = items.find(i => i.id === selectedItemId);
      if (!it) return;
      const oldW = it.w, oldL = it.l;
      it.w = oldL; it.l = oldW;
      const validated = resolveCollision(it, it.x, it.y);
      it.x = validated.x; it.y = validated.y;
      it.rot = (it.rot + 90) % 360;
      updateAll();
    }

    function reset2DView() { viewZoom = 1.0; viewPanX = 0; viewPanY = 0; draw2D(); }

    function resolveCollision(it, targetX, targetY) {
      const W = parseFloat(document.getElementById('rm-w').value) || 2150;
      const L = parseFloat(document.getElementById('rm-l').value) || 2650;
      let resX = Math.max(0, Math.min(targetX, W - it.w));
      let resY = Math.max(0, Math.min(targetY, L - it.l));

      if (it.face === 'floor') {
        structures.filter(s => s.type === 'pillar').forEach(p => {
          const overlapX = (resX < p.x + p.w) && (resX + it.w > p.x);
          const overlapY = (resY < p.y + p.l) && (resY + it.l > p.y);
          if (overlapX && overlapY) {
            const distLeft = (p.x) - (resX + it.w), distRight = (p.x + p.w) - resX;
            const distTop = (p.y) - (resY + it.l), distBottom = (p.y + p.l) - resY;
            const minAbs = Math.min(Math.abs(distLeft), Math.abs(distRight), Math.abs(distTop), Math.abs(distBottom));
            if (minAbs === Math.abs(distRight)) resX = p.x + p.w;
            else if (minAbs === Math.abs(distLeft)) resX = p.x - it.w;
            else if (minAbs === Math.abs(distBottom)) resY = p.y + p.l;
            else if (minAbs === Math.abs(distTop)) resY = p.y - it.l;
          }
        });

        // 開門區域阻擋
        const doorLeft = roomDoor.x, doorRight = roomDoor.x + roomDoor.w;
        const doorTop = L - roomDoor.swingRadius;
        if (resY + it.l > doorTop && resX < doorRight && resX + it.w > doorLeft) {
          resY = doorTop - it.l;
        }
      }
      return { x: Math.max(0, Math.round(resX)), y: Math.max(0, Math.round(resY)) };
    }

    const cv = document.getElementById('cv-2d');
    let isDragging = false, dragStartX = 0, dragStartY = 0, itemOrigX = 0, itemOrigY = 0;
    
    cv.addEventListener('pointerdown', e => {
      const rect = cv.getBoundingClientRect();
      const clickX = e.clientX - rect.left, clickY = e.clientY - rect.top;
      const hit = getHitItem(clickX, clickY);
      if (hit) {
        selectedItemId = hit.id;
        isDragging = true;
        dragStartX = clickX; dragStartY = clickY;
        itemOrigX = hit.x; itemOrigY = hit.y;
        document.getElementById('float-ctrl').style.display = 'flex';
      } else {
        selectedItemId = null;
        document.getElementById('float-ctrl').style.display = 'none';
      }
      updateAll();
    });

    window.addEventListener('pointermove', e => {
      if (!isDragging || !selectedItemId) return;
      const rect = cv.getBoundingClientRect();
      const curX = e.clientX - rect.left, curY = e.clientY - rect.top;
      const it = items.find(i => i.id === selectedItemId);
      if (it) {
        const sc = getScale();
        const targetX = itemOrigX + (curX - dragStartX) / sc;
        const targetY = itemOrigY + (curY - dragStartY) / sc;
        const resolved = resolveCollision(it, targetX, targetY);
        it.x = resolved.x; it.y = resolved.y;
        updateAll();
      }
    });

    window.addEventListener('pointerup', () => { isDragging = false; });
    cv.addEventListener('wheel', e => {
      e.preventDefault();
      viewZoom = Math.min(Math.max(0.6, viewZoom - e.deltaY * 0.001), 4.0);
      draw2D();
    }, { passive: false });

    function getScale() {
      const W = parseFloat(document.getElementById('rm-w').value) || 2150;
      const L = parseFloat(document.getElementById('rm-l').value) || 2650;
      return (240 / Math.max(W, L)) * viewZoom;
    }

    function getHitItem(cx, cy) {
      const sc = getScale();
      const W = parseFloat(document.getElementById('rm-w').value) || 2150;
      const L = parseFloat(document.getElementById('rm-l').value) || 2650;
      const ox = (cv.width - W * sc) / 2 + viewPanX, oy = (cv.height - L * sc) / 2 + viewPanY;
      return items.find(it => {
        if (it.face !== curFace) return false;
        const rx = ox + it.x * sc, ry = oy + it.y * sc, rw = it.w * sc, rh = it.l * sc;
        return cx >= rx && cx <= rx + rw && cy >= ry && cy <= ry + rh;
      });
    }

    function updateAll() {
      calcAllMaterials();
      renderChips();
      draw2D();
      draw3D();
    }

    function calcAllMaterials() {
      const W = parseFloat(document.getElementById('rm-w').value) || 2150;
      const L = parseFloat(document.getElementById('rm-l').value) || 2650;
      const H = parseFloat(document.getElementById('rm-h').value) || 2600;

      const rawFloorM2 = (W * L) / 1000000;
      let pillarAreaM2 = 0;
      structures.filter(s => s.type === 'pillar').forEach(p => { pillarAreaM2 += (p.w * p.l) / 1000000; });
      const netFloorM2 = Math.max(0, rawFloorM2 - pillarAreaM2);
      const netFloorSqft = (netFloorM2 * 10.764);
      const orderFloorSqft = (netFloorSqft * 1.1);

      const fPrice = parseFloat(document.getElementById('inp-floor-price')?.value) || 35;
      const floorTotalCost = Math.round(orderFloorSqft * fPrice);

      const totalWallM2 = ((W + L) * 2 * H) / 1000000;
      const doorM2 = (roomDoor.w * roomDoor.h) / 1000000;
      const netPaintM2 = Math.max(0, totalWallM2 - doorM2);
      const netPaintSqft = (netPaintM2 * 10.764);
      const pPrice = parseFloat(document.getElementById('inp-paint-price')?.value) || 22;
      const paintTotalCost = Math.round(netPaintSqft * pPrice);
      const volM3 = ((W * L * H) / 1000000000).toFixed(1);

      document.getElementById('stat-text').innerHTML = 
        `實鋪：<b>${netFloorSqft.toFixed(1)}</b>呎 (備料<b>${orderFloorSqft.toFixed(1)}</b>呎) | 地板約 <b>HK$${floorTotalCost}</b> | 油漆約 <b>HK$${paintTotalCost}</b>`;

      document.getElementById('mat-floor-sqft').innerText = `${netFloorSqft.toFixed(1)} 呎 (${netFloorM2.toFixed(2)} ㎡)`;
      document.getElementById('mat-pillar-sub').innerText = `- ${(pillarAreaM2 * 10.764).toFixed(1)} 呎`;
      document.getElementById('mat-floor-order').innerText = `${orderFloorSqft.toFixed(1)} 呎`;
      document.getElementById('mat-floor-cost').innerText = `HK$ ${floorTotalCost.toLocaleString()}`;
      document.getElementById('mat-paint-sqft').innerText = `${netPaintSqft.toFixed(1)} 呎 (${netPaintM2.toFixed(2)} ㎡)`;
      document.getElementById('mat-paint-cost').innerText = `HK$ ${paintTotalCost.toLocaleString()}`;
      document.getElementById('mat-vol').innerText = `${volM3} 立方米`;
    }

    function renderChips() {
      const cont = document.getElementById('chips-container');
      cont.innerHTML = '';
      if (curCategory === 'struct') {
        cont.innerHTML += `<div class="chip" style="border-color:#f39c12;">🚪 房門 (後牆)</div>`;
        structures.forEach(s => {
          cont.innerHTML += `<div class="chip" style="border-color:${s.type==='pillar'?'#e84118':'#e67e22'};">🏛️ ${s.name} <span class="del" onclick="removeStructure(${s.id})">×</span></div>`;
        });
      } else {
        items.forEach(i => {
          const isSel = i.id === selectedItemId;
          cont.innerHTML += `<div class="chip ${isSel?'active':''}" onclick="selectItemFromChip(${i.id})">🛋️ ${i.name} (${i.face}) <span class="del" onclick="removeItem(${i.id})">×</span></div>`;
        });
      }
    }

    function selectItemFromChip(id) {
      selectedItemId = id;
      const it = items.find(i => i.id === id);
      if (it && it.face !== curFace) { switchFace(it.face); }
      else { updateAll(); }
    }

    function removeStructure(id) { structures = structures.filter(s => s.id !== id); updateAll(); }
    function removeItem(id) { items = items.filter(i => i.id !== id); updateAll(); }

    function draw2D() {
      const ctx = cv.getContext('2d');
      ctx.clearRect(0, 0, cv.width, cv.height);
      const W = parseFloat(document.getElementById('rm-w').value) || 2150;
      const L = parseFloat(document.getElementById('rm-l').value) || 2650;
      const sc = getScale();
      const ox = (cv.width - W * sc) / 2 + viewPanX, oy = (cv.height - L * sc) / 2 + viewPanY;

      ctx.fillStyle = '#333'; ctx.fillRect(ox, oy, W * sc, L * sc);
      ctx.strokeStyle = '#0070f3'; ctx.lineWidth = 2; ctx.strokeRect(ox, oy, W * sc, L * sc);

      if (curFace === 'floor') {
        const doorX = ox + roomDoor.x * sc, doorY = oy + L * sc, doorW = roomDoor.w * sc;
        ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(doorX, doorY); ctx.lineTo(doorX, doorY - doorW); ctx.stroke();
        ctx.setLineDash([4, 4]); ctx.beginPath();
        ctx.arc(doorX, doorY, doorW, -Math.PI/2, 0); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = '#f1c40f'; ctx.font = '9px sans-serif'; ctx.fillText('🚪 開門弧線 (阻擋區)', doorX + 8, doorY - 8);
      }

      if (curFace === 'floor' || curFace === 'ceiling') {
        structures.forEach(s => {
          ctx.fillStyle = s.type === 'pillar' ? '#e84118' : 'rgba(230, 126, 34, 0.7)';
          ctx.fillRect(ox + s.x * sc, oy + s.y * sc, s.w * sc, s.l * sc);
        });
      }

      items.filter(i => i.face === curFace).forEach(it => {
        const isSel = it.id === selectedItemId;
        ctx.fillStyle = it.name.includes('電掣') ? '#e74c3c' : (isSel ? '#0984e3' : 'rgba(140,122,230,0.85)');
        ctx.fillRect(ox + it.x * sc, oy + it.y * sc, it.w * sc, it.l * sc);
        ctx.strokeStyle = isSel ? '#00ffcc' : '#ffffff';
        ctx.lineWidth = isSel ? 2 : 1;
        ctx.strokeRect(ox + it.x * sc, oy + it.y * sc, it.w * sc, it.l * sc);
        ctx.fillStyle = '#fff'; ctx.font = '9px sans-serif';
        ctx.fillText(it.name, ox + it.x * sc + 2, oy + it.y * sc + 10);
      });
    }

    function draw3D() {
      while(roomGroup.children.length) roomGroup.remove(roomGroup.children[0]);
      const W = parseFloat(document.getElementById('rm-w').value)/1000;
      const L = parseFloat(document.getElementById('rm-l').value)/1000;
      const H = parseFloat(document.getElementById('rm-h').value)/1000;
      
      const fl = new THREE.Mesh(new THREE.PlaneGeometry(W, L), new THREE.MeshStandardMaterial({ color: 0x555 }));
      fl.rotation.x = -Math.PI / 2; roomGroup.add(fl);
      const wallMat = new THREE.MeshStandardMaterial({ color: 0xefede6, roughness: 0.8 });

      // 前牆
      const fWall = new THREE.Mesh(new THREE.BoxGeometry(W, H, 0.05), wallMat);
      fWall.position.set(0, H/2, -L/2); roomGroup.add(fWall);
      // 左牆
      const lWall = new THREE.Mesh(new THREE.BoxGeometry(0.05, H, L), wallMat);
      lWall.position.set(-W/2, H/2, 0); roomGroup.add(lWall);

      // 後牆門口
      const dw = roomDoor.w/1000, dh = roomDoor.h/1000, dx = roomDoor.x/1000;
      if (dx > 0) {
        const ldw = new THREE.Mesh(new THREE.BoxGeometry(dx, H, 0.05), wallMat);
        ldw.position.set(-W/2 + dx/2, H/2, L/2); roomGroup.add(ldw);
      }
      const tdw = new THREE.Mesh(new THREE.BoxGeometry(dw, H - dh, 0.05), wallMat);
      tdw.position.set(-W/2 + dx + dw/2, dh + (H - dh)/2, L/2); roomGroup.add(tdw);
      const rightW = W - (dx + dw);
      if (rightW > 0) {
        const rdw = new THREE.Mesh(new THREE.BoxGeometry(rightW, H, 0.05), wallMat);
        rdw.position.set(W/2 - rightW/2, H/2, L/2); roomGroup.add(rdw);
      }

      structures.forEach(s => {
        const sw = s.w/1000, sl = s.l/1000;
        if (s.type === 'pillar') {
          const colMesh = new THREE.Mesh(new THREE.BoxGeometry(sw, H, sl), new THREE.MeshStandardMaterial({ color: 0x576574 }));
          colMesh.position.set(-W/2 + (s.x/1000) + sw/2, H/2, -L/2 + (s.y/1000) + sl/2);
          roomGroup.add(colMesh);
        } else if (s.type === 'beam') {
          const sd = (s.d || 350)/1000;
          const beamMesh = new THREE.Mesh(new THREE.BoxGeometry(sw, sd, sl), new THREE.MeshStandardMaterial({ color: 0x7f8c8d }));
          beamMesh.position.set(-W/2 + (s.x/1000) + sw/2, H - sd/2, -L/2 + (s.y/1000) + sl/2);
          roomGroup.add(beamMesh);
        }
      });

      items.forEach(it => {
        const iw = it.w/1000, il = it.l/1000, ih = it.h/1000;
        let px = -W/2 + (it.x/1000) + iw/2, py = ih/2, pz = -L/2 + (it.y/1000) + il/2;
        if (it.face === 'front') { px = -W/2 + (it.x/1000) + iw/2; py = (it.y/1000) + ih/2; pz = -L/2 + 0.05; }
        else if (it.face === 'ceiling') { py = H - ih/2; }
        const msh = new THREE.Mesh(new THREE.BoxGeometry(iw, ih, il), new THREE.MeshStandardMaterial({ color: it.col || 0x8c7ae6 }));
        msh.position.set(px, py, pz);
        roomGroup.add(msh);
      });
      resizeRenderer();
    }

    function exportWhatsApp() {
      const stat = document.getElementById('stat-text').innerText;
      const msg = `【圖層王香港房型報價單】\n${stat}\n傢俬清單：\n${items.map(i => `- ${i.name} (${i.face})`).join('\n')}`;
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`);
    }

    window.onload = () => {
      document.getElementById('txt-area').value = defaultTxtBlueprint;
      parseTxtBlueprint(defaultTxtBlueprint);
      resizeRenderer();
      updateAll();
      (function anim(){ requestAnimationFrame(anim); controls.update(); renderer.render(scene, camera); })();
    };
    window.onresize = resizeRenderer;
  </script>
</body>
</html>
