<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>圖層王 - 2D驅動3D空間卡帶</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #1a1a1a; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    /* 頂部操作欄 */
    #header { padding: 8px 10px; background: #262626; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; z-index: 10; border-bottom: 1px solid #333; }
    .input-group { display: flex; align-items: center; gap: 3px; font-size: 11px; }
    input, select { padding: 4px 6px; border-radius: 4px; border: 1px solid #444; background: #333; color: #fff; font-size: 11px; }
    input { width: 52px; }
    button { padding: 5px 9px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; font-size: 11px; }
    .btn-action { background: #0070f3; color: #fff; }
    .btn-add { background: #4b6584; color: #fff; }

    /* 條目微型清單抽屜（橫向滑動） */
    #item-deck { padding: 5px 10px; background: #1e1e1e; display: flex; gap: 6px; overflow-x: auto; border-bottom: 1px solid #333; white-space: nowrap; }
    .chip { background: #2f3640; border: 1px solid #555; padding: 3px 8px; border-radius: 12px; font-size: 10px; display: inline-flex; align-items: center; gap: 5px; }
    .chip span.del { color: #ff6b6b; cursor: pointer; font-weight: bold; margin-left: 2px; }

    /* 主工作區：手機直屏上下分欄 */
    #workspace { display: flex; flex: 1; min-height: 0; width: 100%; position: relative; flex-direction: column; }
    @media (min-width: 769px) { #workspace { flex-direction: row; } }

    #pane-2d { flex: 1; border-bottom: 1px solid #333; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #222; position: relative; overflow: hidden; }
    #pane-3d { flex: 1; position: relative; overflow: hidden; width: 100%; height: 100%; }
    
    .pane-tag { position: absolute; top: 6px; left: 6px; color: #aaa; font-size: 10px; z-index: 5; background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 4px; pointer-events: none; }
    canvas#cv-2d { background: #2d2d2d; border: 1px solid #444; border-radius: 4px; max-width: 92%; max-height: 92%; }

    /* 底部資訊列 */
    #info-bar { padding: 6px 10px; background: #111; font-size: 11px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #333; gap: 8px; }
    #stat-text { flex: 1; line-height: 1.3; color: #ddd; }
    #stat-text b { color: #fff; }
    #btn-wa { background: #25D366; color: #fff; white-space: nowrap; }

    /* 彈出抽屜 Modal */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 99; justify-content: center; align-items: center; }
    .modal-content { background: #2c3e50; padding: 15px; border-radius: 8px; width: 85%; max-width: 320px; font-size: 12px; display: flex; flex-direction: column; gap: 8px; }
    .modal-content label { display: flex; justify-content: space-between; align-items: center; }
    .modal-content input, .modal-content select { width: 120px; }
    .modal-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 5px; }
  </style>
</head>
<body>

  <!-- 控制面板 -->
  <div id="header">
    <div class="input-group"><label>闊:</label><input type="number" id="rm-w" value="3200"></div>
    <div class="input-group"><label>長:</label><input type="number" id="rm-l" value="3800"></div>
    <div class="input-group"><label>高:</label><input type="number" id="rm-h" value="2600"></div>
    <div class="input-group">
      <select id="tile-sz">
        <option value="600">600磚</option>
        <option value="300">300磚</option>
        <option value="800">800磚</option>
      </select>
    </div>
    <button class="btn-add" onclick="openModal('modal-struct')">➕ 加柱/樑</button>
    <button class="btn-add" onclick="openModal('modal-item')">➕ 加傢俬</button>
    <button class="btn-action" onclick="updateAll()">🔄 更新</button>
  </div>

  <!-- 條目抽屜（清單 Tag） -->
  <div id="item-deck">
    <span style="font-size: 10px; color:#888; align-self:center;">清單:</span>
    <div id="chips-container" style="display:inline-flex; gap:6px;"></div>
  </div>

  <!-- 主操作區：上 2D 俯瞰，下 3D 空間 -->
  <div id="workspace">
    <div id="pane-2d">
      <div class="pane-tag">📐 2D 俯瞰（紅=柱, 橙=樑陣, 藍/紫=傢俬）</div>
      <canvas id="cv-2d" width="300" height="300"></canvas>
    </div>
    <div id="pane-3d">
      <div class="pane-tag">🧊 3D 空間（手勢拖曳旋轉 / 雙指縮放）</div>
    </div>
  </div>

  <!-- 底部核算 -->
  <div id="info-bar">
    <div id="stat-text">計算中...</div>
    <button id="btn-wa" onclick="exportWhatsApp()">📲 WhatsApp 出單</button>
  </div>

  <!-- Modal 1: 加柱 / 樑結構 -->
  <div id="modal-struct" class="modal">
    <div class="modal-content">
      <b>🏛️ 新增建築結構 (不可改動)</b>
      <label>類型:
        <select id="st-type">
          <option value="pillar">石屎柱 (直通地天)</option>
          <option value="beam">頂陣/大樑 (吊天花)</option>
        </select>
      </label>
      <label>名稱: <input type="text" id="st-name" value="主力角柱"></label>
      <label>闊(X mm): <input type="number" id="st-w" value="400"></label>
      <label>長(Y mm): <input type="number" id="st-l" value="400"></label>
      <label>深(吊高 mm): <input type="number" id="st-d" value="350" title="樑深"></label>
      <label>座標 X(mm): <input type="number" id="st-x" value="0"></label>
      <label>座標 Y(mm): <input type="number" id="st-y" value="0"></label>
      <div class="modal-btns">
        <button onclick="closeModal('modal-struct')">取消</button>
        <button class="btn-action" onclick="addStructure()">加入</button>
      </div>
    </div>
  </div>

  <!-- Modal 2: 加 IKEA / 淘寶傢俬 -->
  <div id="modal-item" class="modal">
    <div class="modal-content">
      <b>🛋️ 新增傢俬 (標準模組/自訂)</b>
      <label>預設範本:
        <select id="item-tpl" onchange="applyItemTpl()">
          <option value="custom">-- 自訂淘寶件 --</option>
          <option value="ikea-bed">IKEA 標準雙人床 (1500x2000)</option>
          <option value="ikea-kallax">IKEA Kallax 四格架 (770x390)</option>
          <option value="ikea-wardrobe">IKEA Pax 大衣櫃 (1000x580)</option>
        </select>
      </label>
      <label>名稱: <input type="text" id="it-name" value="IKEA雙人床"></label>
      <label>吸附型態:
        <select id="it-mount">
          <option value="onFloor">貼地 (onFloor)</option>
          <option value="onWall">掛牆 (onWall)</option>
          <option value="onCeiling">吸頂 (onCeiling)</option>
        </select>
      </label>
      <label>闊(W mm): <input type="number" id="it-w" value="1500"></label>
      <label>長(L mm): <input type="number" id="it-l" value="2000"></label>
      <label>高(H mm): <input type="number" id="it-h" value="450"></label>
      <label>座標 X(mm): <input type="number" id="it-x" value="400"></label>
      <label>座標 Y(mm): <input type="number" id="it-y" value="0"></label>
      <label>離地高(mm): <input type="number" id="it-z" value="0" title="掛牆用"></label>
      <div class="modal-btns">
        <button onclick="closeModal('modal-item')">取消</button>
        <button class="btn-action" onclick="addItem()">加入</button>
      </div>
    </div>
  </div>

  <script>
    // 核心數據結構（由一件開始，隨時加減）
    let structures = [
      { id: 1, type: "pillar", name: "主力角柱", x: 0, y: 0, w: 400, l: 400, d: 2600 }
    ];
    let items = [
      { id: 101, name: "IKEA雙人床", w: 1500, l: 2000, h: 450, x: 400, y: 0, zOff: 0, mount: "onFloor", col: 0x8c7ae6 }
    ];

    // 初始化 Three.js
    const container3D = document.getElementById('pane-3d');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x181818);
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container3D.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const dLight = new THREE.DirectionalLight(0xffffff, 0.6);
    dLight.position.set(6, 12, 8);
    scene.add(dLight);

    let roomGroup = new THREE.Group();
    scene.add(roomGroup);

    function resizeRenderer() {
      const w = container3D.clientWidth, h = container3D.clientHeight;
      if (!w || !h) return;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    // Modal 控制
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function applyItemTpl() {
      const val = document.getElementById('item-tpl').value;
      if (val === 'ikea-bed') {
        document.getElementById('it-name').value = "IKEA雙人床";
        document.getElementById('it-w').value = 1500; document.getElementById('it-l').value = 2000; document.getElementById('it-h').value = 450;
        document.getElementById('it-mount').value = "onFloor";
      } else if (val === 'ikea-kallax') {
        document.getElementById('it-name').value = "Kallax四格架";
        document.getElementById('it-w').value = 770; document.getElementById('it-l').value = 390; document.getElementById('it-h').value = 770;
        document.getElementById('it-mount').value = "onFloor";
      } else if (val === 'ikea-wardrobe') {
        document.getElementById('it-name').value = "Pax大衣櫃";
        document.getElementById('it-w').value = 1000; document.getElementById('it-l').value = 580; document.getElementById('it-h').value = 2360;
        document.getElementById('it-mount').value = "onFloor";
      }
    }

    function addStructure() {
      structures.push({
        id: Date.now(),
        type: document.getElementById('st-type').value,
        name: document.getElementById('st-name').value,
        w: parseFloat(document.getElementById('st-w').value) || 400,
        l: parseFloat(document.getElementById('st-l').value) || 400,
        d: parseFloat(document.getElementById('st-d').value) || 350,
        x: parseFloat(document.getElementById('st-x').value) || 0,
        y: parseFloat(document.getElementById('st-y').value) || 0
      });
      closeModal('modal-struct');
      updateAll();
    }

    function addItem() {
      const m = document.getElementById('it-mount').value;
      const col = m === 'onCeiling' ? 0x00d2d3 : (m === 'onWall' ? 0xe1b12c : 0x8c7ae6);
      items.push({
        id: Date.now(),
        name: document.getElementById('it-name').value,
        mount: m,
        w: parseFloat(document.getElementById('it-w').value) || 1000,
        l: parseFloat(document.getElementById('it-l').value) || 1000,
        h: parseFloat(document.getElementById('it-h').value) || 500,
        x: parseFloat(document.getElementById('it-x').value) || 0,
        y: parseFloat(document.getElementById('it-y').value) || 0,
        zOff: parseFloat(document.getElementById('it-z').value) || 0,
        col: col
      });
      closeModal('modal-item');
      updateAll();
    }

    function removeStructure(id) {
      structures = structures.filter(s => s.id !== id);
      updateAll();
    }

    function removeItem(id) {
      items = items.filter(i => i.id !== id);
      updateAll();
    }

    // 渲染條目清單 (Chips)
    function renderChips() {
      const cont = document.getElementById('chips-container');
      cont.innerHTML = '';
      structures.forEach(s => {
        cont.innerHTML += `<div class="chip" style="border-color:#e84118;">🏛️ ${s.name} <span class="del" onclick="removeStructure(${s.id})">×</span></div>`;
      });
      items.forEach(i => {
        cont.innerHTML += `<div class="chip" style="border-color:#00a8ff;">🛋️ ${i.name} <span class="del" onclick="removeItem(${i.id})">×</span></div>`;
      });
    }

    // 核心同步計算
    function updateAll() {
      const W = parseFloat(document.getElementById('rm-w').value) || 3200;
      const L = parseFloat(document.getElementById('rm-l').value) || 3800;
      const H = parseFloat(document.getElementById('rm-h').value) || 2600;
      const T = parseFloat(document.getElementById('tile-sz').value) || 600;

      renderChips();

      // 料量計算
      const areaM2 = (W * L) / 1000000;
      const areaFt2 = areaM2 * 10.764;
      const tilesTotal = Math.ceil(((Math.ceil(W/T) * Math.ceil(L/T))) * 1.1);
      const wallPaint = (((W + L) * 2 * H) / 1000000).toFixed(1);

      document.getElementById('stat-text').innerHTML = 
        `面積：<b>${areaM2.toFixed(1)}</b>㎡ (${areaFt2.toFixed(0)}呎) | 地磚：<b>${tilesTotal}</b>塊(+10%損耗) | 牆漆：<b>${wallPaint}</b>㎡`;

      draw2D(W, L, T);
      draw3D(W, L, H, T);
    }

    // 2D 畫布
    function draw2D(W, L, T) {
      const cv = document.getElementById('cv-2d'), ctx = cv.getContext('2d');
      ctx.clearRect(0, 0, cv.width, cv.height);

      const maxDim = Math.max(W, L);
      const scale = 230 / maxDim;
      const drawW = W * scale, drawL = L * scale;
      const ox = (cv.width - drawW) / 2, oy = (cv.height - drawL) / 2;

      // 地台與磚格
      ctx.fillStyle = '#333';
      ctx.fillRect(ox, oy, drawW, drawL);
      ctx.strokeStyle = '#4a4a4a';
      ctx.lineWidth = 1;
      const step = T * scale;
      for (let x = ox; x <= ox + drawW + 0.1; x += step) { ctx.beginPath(); ctx.moveTo(x, oy); ctx.lineTo(x, oy + drawL); ctx.stroke(); }
      for (let y = oy; y <= oy + drawL + 0.1; y += step) { ctx.beginPath(); ctx.moveTo(ox, y); ctx.lineTo(ox + drawW, y); ctx.stroke(); }

      // 畫結構（柱/樑）
      structures.forEach(s => {
        if (s.type === 'pillar') {
          ctx.fillStyle = '#e84118';
          ctx.fillRect(ox + s.x * scale, oy + s.y * scale, s.w * scale, s.l * scale);
        } else {
          ctx.fillStyle = 'rgba(230, 126, 34, 0.6)';
          ctx.fillRect(ox + s.x * scale, oy + s.y * scale, s.w * scale, s.l * scale);
          ctx.strokeStyle = '#e67e22';
          ctx.strokeRect(ox + s.x * scale, oy + s.y * scale, s.w * scale, s.l * scale);
        }
      });

      // 畫傢俬
      items.forEach(it => {
        ctx.fillStyle = it.mount === 'onCeiling' ? 'rgba(0,210,211,0.6)' : (it.mount === 'onWall' ? 'rgba(225,177,44,0.7)' : 'rgba(140,122,230,0.8)');
        ctx.fillRect(ox + it.x * scale, oy + it.y * scale, it.w * scale, it.l * scale);
        ctx.strokeStyle = '#fff';
        ctx.strokeRect(ox + it.x * scale, oy + it.y * scale, it.w * scale, it.l * scale);
      });

      // 標註
      ctx.strokeStyle = '#0070f3';
      ctx.lineWidth = 2;
      ctx.strokeRect(ox, oy, drawW, drawL);
      ctx.fillStyle = '#aaa';
      ctx.font = '10px sans-serif';
      ctx.fillText(`${W}mm`, ox + drawW/2 - 18, oy - 5);
      ctx.fillText(`${L}mm`, ox + drawW + 4, oy + drawL/2);
    }

    // 3D 渲染
    function draw3D(W, L, H, T) {
      while(roomGroup.children.length > 0) roomGroup.remove(roomGroup.children[0]);

      const sW = W / 1000, sL = L / 1000, sH = H / 1000;
      const tx = Math.ceil(W / T), tz = Math.ceil(L / T);

      // 地板貼圖
      const canvasTex = document.createElement('canvas');
      canvasTex.width = 128; canvasTex.height = 128;
      const tctx = canvasTex.getContext('2d');
      tctx.fillStyle = '#dcdde1'; tctx.fillRect(0, 0, 128, 128);
      tctx.strokeStyle = '#718093'; tctx.lineWidth = 4;
      tctx.strokeRect(0, 0, 128, 128);
      const floorTex = new THREE.CanvasTexture(canvasTex);
      floorTex.wrapS = THREE.RepeatWrapping; floorTex.wrapT = THREE.RepeatWrapping;
      floorTex.repeat.set(tx, tz);

      const floor = new THREE.Mesh(new THREE.PlaneGeometry(sW, sL), new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.3 }));
      floor.rotation.x = -Math.PI / 2;
      roomGroup.add(floor);

      // 牆
      const wallMat = new THREE.MeshStandardMaterial({ color: 0xefede6, roughness: 0.8 });
      const backWall = new THREE.Mesh(new THREE.BoxGeometry(sW, sH, 0.05), wallMat);
      backWall.position.set(0, sH / 2, -sL / 2);
      roomGroup.add(backWall);

      const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.05, sH, sL), wallMat);
      leftWall.position.set(-sW / 2, sH / 2, 0);
      roomGroup.add(leftWall);

      // 渲染結構（柱與樑）
      structures.forEach(s => {
        const sw = s.w / 1000, sl = s.l / 1000;
        if (s.type === 'pillar') {
          const colMesh = new THREE.Mesh(new THREE.BoxGeometry(sw, sH, sl), new THREE.MeshStandardMaterial({ color: 0x576574 }));
          colMesh.position.set(-sW/2 + (s.x/1000) + sw/2, sH/2, -sL/2 + (s.y/1000) + sl/2);
          roomGroup.add(colMesh);
        } else {
          // 頂陣大樑（吊喺天花）
          const sd = (s.d || 350) / 1000;
          const beamMesh = new THREE.Mesh(new THREE.BoxGeometry(sw, sd, sl), new THREE.MeshStandardMaterial({ color: 0xd35400 }));
          beamMesh.position.set(-sW/2 + (s.x/1000) + sw/2, sH - sd/2, -sL/2 + (s.y/1000) + sl/2);
          roomGroup.add(beamMesh);
        }
      });

      // 渲染傢俬
      items.forEach(it => {
        const iw = it.w / 1000, il = it.l / 1000, ih = it.h / 1000;
        let py = ih / 2;
        if (it.mount === "onWall") py = (it.zOff / 1000) + ih / 2;
        else if (it.mount === "onCeiling") py = sH - (ih / 2);

        const msh = new THREE.Mesh(new THREE.BoxGeometry(iw, ih, il), new THREE.MeshStandardMaterial({ color: it.col || 0x8c7ae6 }));
        msh.position.set(-sW/2 + (it.x/1000) + iw/2, py, -sL/2 + (it.y/1000) + il/2);
        roomGroup.add(msh);
      });

      camera.position.set(sW * 1.3, sH * 1.4, sL * 1.5);
      controls.target.set(0, sH / 3, 0);
      controls.update();
      resizeRenderer();
    }

    // 匯出 WhatsApp
    function exportWhatsApp() {
      const W = document.getElementById('rm-w').value, L = document.getElementById('rm-l').value;
      const stat = document.getElementById('stat-text').innerText;
      const structList = structures.map(s => `- [結構] ${s.name} (${s.type})`).join('\n');
      const itemList = items.map(i => `- [傢俬] ${i.name} (${i.w}x${i.l}x${i.h}mm)`).join('\n');
      const msg = `【圖層王報價清單】\n空間：${W}x${L}mm\n${stat}\n\n結構：\n${structList}\n\n傢俬清單：\n${itemList}`;
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    window.onload = () => { resizeRenderer(); updateAll(); animate(); };
    window.onresize = resizeRenderer;
  </script>
</body>
</html>
